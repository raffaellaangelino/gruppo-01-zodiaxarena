server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # DNS interno di Docker: nginx parte anche se il backend non è ancora attivo
    resolver 127.0.0.11 valid=30s;

    # Chiamate API inoltrate al container del backend (stessa origine, niente CORS)
    location /api/ {
        set $backend http://backend:8081;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # File con hash nel nome: si possono tenere in cache a lungo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Applicazione a pagina singola: ogni percorso sconosciuto apre index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

services:
    backend:
        build: ./backend
        restart: unless-stopped
        container_name: backend
        # TODO: depends on db
        # TODO: enviroment var
        ports:
            - 8081:8081
        healthcheck:
            test: [ "CMD", "wget", "-qO-", "http://localhost:8081/actuator/health" ]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 40s

    frontend:
        build: ./frontend
        restart: unless-stopped
        container_name: frontend
        ports:
            - 8080:80
        healthcheck:
            test: [ "CMD", "wget", "-qO-", "http://127.0.0.1/" ]
            interval: 30s
            timeout: 3s
            retries: 3
            start_period: 10s

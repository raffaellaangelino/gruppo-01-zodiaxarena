spring.application.name=zodiax_arena_backend

server.port=8081

# AUTENTICAZIONE
zodiax.jwt.secret-key=${JWT_SECRET_KEY:vh4zPEAXNY6u3tyE/BG6uHQWPBgeMtJ5uz0kodZuu1M=}
zodiax.jwt.expiration-ms=${JWT_EXPIRATION_MS:900000}

# SWAGGER
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# DB
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/zodiax}
